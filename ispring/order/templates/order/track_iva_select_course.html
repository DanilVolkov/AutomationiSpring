{% extends 'base.html' %}
{% load static %}

{% block mainmenu %}
<header class="p-3 text-bg-light">
    <div class="d-flex justify-content-center">
        <h1 class="h5 mb-0">Выбор курса траектории</h1>
    </div>
</header>
{% endblock %}

{% block content %}
<div class="container-fluid mt-4 px-4">

    <div id="courses-container">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <div class="text-muted mt-3">Загрузка списка курсов...</div>
        </div>
    </div>

    <div class="d-flex justify-content-end gap-3 mt-5 mb-5 pt-3 border-top">
        <button type="button" id="btn-cancel" class="btn btn-outline-secondary">
            Отменить загрузку
        </button>
        <button type="button" id="btn-next" class="btn btn-primary" disabled>
            Далее
        </button>
    </div>

</div>

<div id="toast-container"
     class="toast-container position-fixed bottom-0 end-0 p-3"
     style="z-index: 1080;"></div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const trackId = "{{ track_id|escapejs }}";
    const container = document.getElementById('courses-container');
    const btnNext = document.getElementById('btn-next');
    const btnCancel = document.getElementById('btn-cancel');
    const toastContainer = document.getElementById('toast-container');

    let selectedCourseId = null;

    // ==================== Утилиты ====================

    function getCsrfToken() {
        const m = document.cookie.match(/csrftoken=([^;]+)/);
        return m ? m[1] : '';
    }

    function escapeHtml(str) {
        return String(str || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    /**
     * Безопасно читает ответ сервера.
     * Возвращает { ok, status, data, text, isJson }.
     */
    async function readResponse(response) {
        const contentType = response.headers.get('content-type') || '';
        const isJson = contentType.includes('application/json');

        if (isJson) {
            try {
                const data = await response.json();
                return {
                    ok: response.ok && (!data || data.ok !== false),
                    status: response.status,
                    data,
                    isJson: true,
                };
            } catch (err) {
                return {
                    ok: false,
                    status: response.status,
                    error: 'Некорректный JSON: ' + err.message,
                    isJson: true,
                };
            }
        }

        let text = '';
        try {
            text = await response.text();
        } catch (_) { /* ignore */ }

        return {
            ok: false,
            status: response.status,
            text,
            isJson: false,
        };
    }

    function buildErrorHtml(title, message) {
        return `
            <div class="alert alert-danger">
                <strong>${escapeHtml(title)}:</strong> ${escapeHtml(message)}
                <button class="btn btn-sm btn-outline-danger ms-3"
                        onclick="window.location.reload()">Повторить</button>
            </div>`;
    }

    function showToast(msg, type, duration = null) {
        const cls = {
            success: 'text-bg-success',
            danger:  'text-bg-danger',
            info:    'text-bg-primary',
        }[type] || 'text-bg-secondary';

        const el = document.createElement('div');
        el.className = `toast align-items-center ${cls} border-0`;
        el.innerHTML = `<div class="d-flex">
            <div class="toast-body">${escapeHtml(msg)}</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>`;
        toastContainer.appendChild(el);
        const t = new bootstrap.Toast(el, { autohide: false });
        t.show();

        let timer = null;
        if (typeof duration === 'number' && duration > 0) {
            timer = setTimeout(() => t.hide(), duration);
        }
        el.addEventListener('hidden.bs.toast', () => {
            if (timer) clearTimeout(timer);
            el.remove();
        });
    }

    // ==================== Загрузка курсов ====================

    fetch(`/track/${encodeURIComponent(trackId)}/iva-select-course/data/`, {
        headers: {'X-Requested-With': 'XMLHttpRequest'},
    })
    .then(readResponse)
    .then(result => {
        // ---------- JSON с ошибкой ----------
        if (result.isJson && result.data && result.data.ok === false) {
            container.innerHTML = buildErrorHtml(
                'Не удалось загрузить список курсов',
                result.data.error || 'неизвестная ошибка'
            );
            return;
        }

        // ---------- JSON с успехом ----------
        if (result.ok && result.data) {
            renderCourses(result.data.courses || []);
            return;
        }

        // ---------- Не-JSON (HTML-страница ошибки) ----------
        if (!result.isJson) {
            console.error('Server returned non-JSON:', result.status, result.text);
            container.innerHTML = buildErrorHtml(
                `Ошибка сервера (${result.status})`,
                'Проверьте логи сервера или попробуйте позже.'
            );
            return;
        }

        // ---------- Неожиданный ответ ----------
        container.innerHTML = buildErrorHtml(
            'Неожиданный ответ',
            'Формат ответа не распознан.'
        );
    })
    .catch(err => {
        console.error('Fetch error:', err);
        container.innerHTML = buildErrorHtml(
            'Сетевая ошибка',
            err.message || 'не удалось связаться с сервером'
        );
    });

    // ==================== Отрисовка курсов ====================

    function renderCourses(courses) {
        if (!courses.length) {
            container.innerHTML = `<div class="alert alert-info">В траектории нет курсов.</div>`;
            return;
        }

        container.innerHTML = `
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <p class="text-muted text-center">
                        Выберите курс, в который нужно добавить содержимое файла.
                    </p>
                    <div class="list-group"></div>
                </div>
            </div>`;

        const list = container.querySelector('.list-group');

        courses.forEach(c => {
            const item = document.createElement('label');
            item.className = 'list-group-item d-flex align-items-center gap-3';
            item.style.cursor = 'pointer';

            // Экранируем title на случай спецсимволов
            const safeTitle = escapeHtml(c.title || '—');

            item.innerHTML = `
                <input type="radio" name="course" class="form-check-input mt-0"
                       value="${escapeHtml(c.id)}">
                <div class="flex-grow-1">
                    <div class="fw-semibold">${safeTitle}</div>
                </div>`;

            const radio = item.querySelector('input');
            radio.addEventListener('change', function () {
                selectedCourseId = c.id;
                btnNext.disabled = false;
            });

            list.appendChild(item);
        });
    }

    // ==================== Далее ====================

    btnNext.addEventListener('click', function () {
        if (!selectedCourseId) return;

        btnNext.disabled = true;

        fetch(`/track/${encodeURIComponent(trackId)}/iva-select-course/apply/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCsrfToken(),
            },
            body: JSON.stringify({ course_id: selectedCourseId }),
        })
        .then(readResponse)
        .then(result => {
            // ---------- Не-JSON ----------
            if (!result.isJson) {
                console.error('Server returned non-JSON:', result.status, result.text);
                showToast(
                    `Ошибка сервера (${result.status}). Смотрите логи.`,
                    'danger'
                );
                return;
            }

            const data = result.data || {};

            // ---------- Ошибка ----------
            if (data.ok === false) {
                showToast('Ошибка: ' + (data.error || 'неизвестная'), 'danger');
                return;
            }

            // ---------- Успех ----------
            if (data.redirect) {
                window.location.href = data.redirect;
            }
        })
        .catch(err => {
            console.error('Fetch error:', err);
            showToast('Ошибка сети: ' + err.message, 'danger');
        })
        .finally(() => { btnNext.disabled = false; });
    });

    // ==================== Отмена ====================

    btnCancel.addEventListener('click', function () {
        btnCancel.disabled = true;

        fetch(`/track/${encodeURIComponent(trackId)}/iva-cancel/`, {
            method: 'POST',
            headers: { 'X-CSRFToken': getCsrfToken() },
        })
        .then(readResponse)
        .then(result => {
            if (!result.isJson) {
                console.error('Server returned non-JSON:', result.status, result.text);
            }
        })
        .catch(err => {
            console.error('Fetch error:', err);
        })
        .finally(() => {
            window.location.href = `/track/${trackId}/`;
        });
    });
});
</script>
{% endblock %}
